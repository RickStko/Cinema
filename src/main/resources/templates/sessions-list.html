<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Кінотеатр - Сеанси</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Розклад сеансів</h1>
        <a th:href="@{/sessions/add}" class="btn btn-primary">Додати новий</a>
    </div>

    <table class="table table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>Фільм</th>
            <th>Кінотеатр</th>
            <th>Жанри</th>
            <th>Тривалість</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${allSessions}">
            <td th:text="${s.name}">Назва</td>
            <td th:text="${s.cinema != null ? s.cinema.name : 'Не призначено'}">Назва кінотеатру</td>
            <td th:text="${s.genres}">Жанри</td>
            <td th:text="${s.duration} + ' хв.'">0.00</td>
            <td>
                <a th:href="@{/sessions/edit/{id}(id=${s.id})}" class="btn btn-sm btn-outline-warning">Редагувати</a>
                <a th:href="@{/sessions/delete/{id}(id=${s.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Ви впевнені?');">Видалити</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
