<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма Сеансу</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div class="card mb-4 p-3 border-info" th:if="${session.id == null}">
    <h5>Швидке заповнення з TMDB</h5>
    <form th:action="@{/sessions/import}" method="get" class="row g-3">
        <div class="col-auto">
            <input type="text" name="tmdbId" class="form-control" placeholder="Введіть ID фільму (н-р: 693134)" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-info text-white">Підтягнути дані</button>
        </div>
    </form>
</div>

<h2 th:text="${session.id == null ? 'Новий сеанс' : 'Редагування сеансу'}">Форма</h2>
<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

<form th:action="@{/sessions/save}" th:object="${session}" method="post" class="mt-4">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
        <label class="form-label">Назва фільму:</label>
        <input type="text" th:field="*{name}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Тривалість (хвилин):</label>
        <input type="number" th:field="*{duration}" class="form-control" step="0.1">
    </div>

    <div class="mb-3">
        <label class="form-label">Опис:</label>
        <textarea th:field="*{plot}" class="form-control" rows="3"></textarea>
    </div>

<!--    <div class="mb-3">-->
<!--        <label class="form-label">Дата початку прокату:</label>-->
<!--        <input type="date" th:field="*{rentFrom}" class="form-control" required>-->
<!--    </div>-->

    <div class="mb-3">
        <label class="form-label">Вікові обмеження (від 0 до 21):</label>
        <input type="number" th:field="*{age_restrictions}" class="form-control" min="0" max="21" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Жанри:</label>
        <input type="text" th:field="*{genres}" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Режисер:</label>
        <input type="text" th:field="*{director}" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Оберіть Кінотеатр:</label>
        <select th:field="*{cinema}" class="form-select" required>
            <option th:each="c : ${allCinemas}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
    </div>

    <div class="alert alert-secondary" th:if="${session.cinema != null}">
        <strong>Інформація про поточний кінотеатр:</strong>
        <p class="mb-0" th:text="'Місто: ' + ${session.cinema.city} + ', Вулиця: ' + ${session.cinema.street} + ' ' + ${session.cinema.number}"></p>
    </div>

    <button type="submit" class="btn btn-success">Зберегти</button>
    <a href="/sessions" class="btn btn-secondary">Назад</a>
</form>

</body>
</html>
